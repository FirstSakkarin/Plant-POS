name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/FirstSakkarin/Plant-POS.git

          # Create orphan branch with only the needed files
          git checkout --orphan gh-pages-tmp
          git rm -rf . --quiet

          git checkout main -- index.html app.js style.css images/ .nojekyll
          git add index.html app.js style.css images/ .nojekyll
          git commit -m "Deploy static site"
          git push origin HEAD:gh-pages --force
